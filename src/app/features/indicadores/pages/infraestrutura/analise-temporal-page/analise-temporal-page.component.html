<div class="analise-temporal-page">
  <app-pagina-cabecalho [titulo]="textos.titulo" [subtitulo]="textos.subtitulo" />

  <section class="filtro-escola" aria-label="Seleção de escola">
    <app-select
      class="filtro-escola__escola"
      [id]="'escola-select'"
      label="Escola"
      placeholder="Selecione uma escola"
      searchPlaceholder="Buscar pelo nome, município ou INEP"
      emptyMessage="Nenhuma escola encontrada"
      [options]="opcoesEscola()"
      [searchable]="true"
      [showClear]="true"
      [loading]="catalogo() === 'carregando'"
      [disabled]="catalogo() !== 'pronto'"
      [ngModel]="escolaSelecionada()?.co_entidade ?? null"
      (ngModelChange)="onEscolaChange($event)"
    />
    <app-select
      class="filtro-escola__municipio"
      [id]="'municipio-select'"
      label="Município"
      placeholder="Todos os municípios"
      searchPlaceholder="Buscar município"
      emptyMessage="Nenhum município encontrado"
      [options]="opcoesMunicipio()"
      [searchable]="true"
      [showClear]="true"
      [loading]="catalogo() === 'carregando'"
      [disabled]="catalogo() !== 'pronto'"
      [ngModel]="municipioSelecionado()"
      (ngModelChange)="onMunicipioChange($event)"
    />
  </section>

  <div class="comparacao-conteudo" aria-live="polite">
    <app-comparacao-resumo [serie]="serie()" [carregando]="carregando()" />

    <p class="dica-grafico">{{ textos.dicaGrafico }}</p>

    <app-comparacao-grafico
      [serie]="serie()"
      [carregando]="carregando()"
      [mensagem]="mensagemGrafico()"
      [erro]="erroGrafico()"
      [acaoLabel]="acaoGrafico()"
      (acao)="tentarNovamente()"
    />

    <div class="detalhes">
      <app-composicao-indice
        [itens]="composicao().itens"
        [estado]="composicao().estado"
        [ano]="composicao().ano"
        [anos]="composicao().anos"
        [resumo]="composicao().resumo"
        (anoChange)="onAnoComposicaoChange($event)"
      />

      <app-painel-territorial
        [itens]="territorial().itens"
        [estado]="territorial().estado"
        [ano]="territorial().ano"
        [municipio]="territorial().municipio"
        [escolasReferencia]="territorial().escolasReferencia"
        [coberturaReduzida]="territorial().coberturaReduzida"
      />

      <section class="regras" aria-labelledby="regras-titulo">
        <h2 id="regras-titulo">Regras metodológicas</h2>
        <ol>
          @for (regra of regras(); track regra) {
            <li>{{ regra }}</li>
          }
        </ol>
      </section>
    </div>
  </div>
</div>
