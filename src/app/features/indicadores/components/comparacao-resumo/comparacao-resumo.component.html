@if (aviso()) {
  <p class="resumo-aviso">{{ aviso() }}</p>
}
<section class="comparacao-resumo" aria-label="Resumo do último ano disponível">
  @for (item of itens(); track item.titulo) {
    <article class="resumo-card">
      <span class="resumo-card__icone" aria-hidden="true">
        <i [class]="'pi ' + item.icone"></i>
      </span>
      <div class="resumo-card__conteudo">
        <span class="resumo-card__titulo">{{ item.titulo }}</span>
        @if (item.tom) {
          <strong
            class="resumo-card__valor resumo-card__valor--chip"
            [class.is-positivo]="item.tom === 'positivo'"
            [class.is-negativo]="item.tom === 'negativo'"
            >{{ item.valor }}</strong
          >
        } @else {
          <strong class="resumo-card__valor">{{ item.valor }}</strong>
        }
        @if (item.descricao) {
          <small>{{ item.descricao }}</small>
        }
      </div>
    </article>
  }
</section>
