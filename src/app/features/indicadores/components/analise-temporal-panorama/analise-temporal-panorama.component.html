<section class="panorama" [attr.aria-label]="titulo() ?? 'Panorama da análise temporal'">
  @if (titulo(); as t) {
    <header class="panorama__header">
      <h2>{{ t }}</h2>
      @if (descricao(); as d) {
        <p>{{ d }}</p>
      }
    </header>
  }

  @if (carregandoFiltros()) {
    <div class="skeleton-page" aria-busy="true" aria-label="Carregando filtros">
      <div class="skeleton-filter-panel">
        <div class="skeleton-bar skeleton-bar--title"></div>
        <div class="skeleton-filter-row">
          <div class="skeleton-bar"></div>
          <div class="skeleton-bar skeleton-bar--sm"></div>
        </div>
      </div>
      <div class="skeleton-charts">
        <div class="skeleton-chart"></div>
        <div class="skeleton-chart"></div>
      </div>
    </div>
  } @else {
    <section class="filtro-temporal" aria-label="Filtros da análise temporal">
      <div class="filtro-temporal__item">
        <label for="metrica-select">Métrica</label>
        <select id="metrica-select" [(ngModel)]="selectedMetrica">
          @for (m of metricas(); track m.chave) {
            <option [ngValue]="m.chave">{{ m.label }}</option>
          }
        </select>
      </div>

      <div class="filtro-temporal__actions">
        <label class="filtro-temporal__pibid">
          <input
            type="checkbox"
            [checked]="selectedPibid === true"
            (change)="onPibidChange($event)"
          />
          <span>Apenas PIBID</span>
        </label>
        <button type="button" (click)="aplicarFiltros()" [disabled]="carregandoGraficos()">
          @if (carregandoGraficos()) {
            <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
            Aplicando...
          } @else {
            Aplicar filtros
          }
        </button>
        <button
          type="button"
          class="btn-reset"
          (click)="resetFiltros()"
          [disabled]="carregandoGraficos()"
        >
          Limpar
        </button>
      </div>
    </section>

    @if (graficos().length > 0) {
      <app-indicadores-charts
        [graficosAnaliseTemporal]="graficos()"
        graficosLayout="grade"
        (layoutChange)="onLayoutChange()"
      ></app-indicadores-charts>
    } @else if (carregandoGraficos()) {
      <div class="skeleton-charts" aria-busy="true">
        <div class="skeleton-chart"></div>
        <div class="skeleton-chart"></div>
      </div>
    } @else {
      <app-estado-card tipo="aviso" titulo="Não há gráficos para exibir.">
        Não foi possível obter a evolução desta métrica. Tente outra métrica ou volte mais tarde.
      </app-estado-card>
    }
  }
</section>
